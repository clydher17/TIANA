<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name=" viewport" content="width=device-width, initial-scale=1.0">
    <!-- Option 1: Include in HTML -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

        <link rel="stylesheet" href="../css/compra.css">
    <script src="../js/carrito.js" defer></script>
    
</head>

<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">TYANA</h1>
            </header>
            <nav>
                <ul>
                    <li><a class="btn-menu btn-carrito" href="../index.html">
                            <i class="bi bi-box-arrow-left"></i>volver</a>
                    </li>
                    <li><a class="btn-menu btn-carrito active" href="../pages/compratotal.html">
                            <i class="bi bi-cart3"></i>Carrito</a>
                    </li>
                </ul>
            </nav>
            

        </aside>
        <main>
            <h2 class="titulo-principal">Carrito de Compra</h2>
        
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio"><i class="bi bi-trash3"></i>Aun no ha agregado productos a su carrito</p>
                <div id="carrito-productos" class="carrito-productos disabled">
        
                </div>
                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar</button>

                    </div>
                    <div class="carrito-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total">$0</p>
                        </div>
                        <button class="carrito-acciones-comprar">Comprar</button>
                    </div>

                </div>
                <p id="carrito-comprado" class="carrito-comprado disabled"><i class="bi bi-emoji-heart"></i>Gracias por elegirnos...!!</p>

            </div>


        </main>
    </div>

</body>
